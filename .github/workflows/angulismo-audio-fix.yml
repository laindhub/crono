name: Angulismo APK diagnostic

on:
  push:
    branches:
      - angulismo-audio-fix
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and fetch Angulismo APK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL 'https://update.angulismotv.workers.dev/version?versionCode=4' -o version.json
          EPHEMERAL_URL="$(jq -r '.apkUrl // empty' version.json)"
          FILE_KEY="$(printf '%s' "$EPHEMERAL_URL" | awk -F/ '{print $(NF-1)}')"
          PAGE_URL="https://www.mediafire.com/file/$FILE_KEY/AngulismoTV_-_BETA.apk/file"
          curl -fsSL -A 'Mozilla/5.0' "$PAGE_URL" -o mediafire.html
          APK_URL="$(grep -m1 'id="downloadButton"' mediafire.html | cut -d'"' -f2 || true)"
          if [ -z "$APK_URL" ]; then
            echo '=== MediaFire downloadButton diagnostics ==='
            grep -i -n -E 'downloadButton|download[^<]{0,80}button|download_link|downloadUrl' mediafire.html | head -80 || true
            exit 2
          fi
          APK_URL="$(printf '%s' "$APK_URL" | sed 's/&amp;/\\&/g')"
          echo "Resolved download URL"
          curl --retry 3 --retry-all-errors -fL -A 'Mozilla/5.0' "$APK_URL" -o app.apk
          ls -lh app.apk
          file app.apk
          unzip -t app.apk >/dev/null
          sha256sum app.apk

      - name: Install APK tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool jq unzip

      - name: Decompile
        run: |
          apktool d -f app.apk -o decompiled

      - name: Inspect UnifiedPlayerActivity
        shell: bash
        run: |
          set -euxo pipefail
          FILE="$(find decompiled -type f -path '*com/angulismotv/UnifiedPlayerActivity.smali' | head -1)"
          test -n "$FILE"
          cp "$FILE" UnifiedPlayerActivity.smali
          grep -n -E 'showExoPlayer|DefaultRenderersFactory|setEnableDecoderFallback|setExtensionRendererMode|ExoPlayer\\$Builder|HlsMediaSource' "$FILE" || true
          echo '=== showExoPlayer method ==='
          awk '/^\\.method.*showExoPlayer/{p=1} p{print} p && /^\\.end method/{exit}' "$FILE"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angulismo-diagnostic
          path: |
            version.json
            mediafire.html
            app.apk
            UnifiedPlayerActivity.smali
          if-no-files-found: ignore
