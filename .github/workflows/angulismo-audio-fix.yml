name: Build Angulismo TV Agenda Fix

on:
  push:
    branches:
      - angulismo-tv-agenda
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Angulismo APK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL 'https://update.angulismotv.workers.dev/version?versionCode=4' -o version.json
          EPHEMERAL_URL="$(jq -r '.apkUrl // empty' version.json)"
          FILE_KEY="$(printf '%s' "$EPHEMERAL_URL" | awk -F/ '{print $(NF-1)}')"
          PAGE_URL="https://www.mediafire.com/file/$FILE_KEY/AngulismoTV_-_BETA.apk/file"
          curl -fsSL -A 'Mozilla/5.0' "$PAGE_URL" -o mediafire.html
          APK_URL="$(grep -m1 'id="downloadButton"' mediafire.html | cut -d'"' -f2)"
          APK_URL="$(printf '%s' "$APK_URL" | sed 's/&amp;/\\&/g')"
          curl --retry 3 --retry-all-errors -fL -A 'Mozilla/5.0' "$APK_URL" -o app.apk
          echo '4bfbffc899cfbd65d77670845716f5982c7e8f07e223bf64d51adf364a9152ad  app.apk' | sha256sum -c -
          unzip -t app.apk >/dev/null

      - name: Get modern Apktool
        run: |
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c -

      - name: Decompile APK
        run: |
          java -jar apktool.jar d -f app.apk -o decompiled

      - name: Patch TV agenda for D-pad navigation
        shell: bash
        run: |
          set -euxo pipefail
          python3 patches/patch_agenda_only.py decompiled patches/agenda-tv.js
          grep -q '__ANGULISMO_TV_AGENDA__' 'decompiled/smali/com/angulismotv/fragments/AgendaFragment$setupWebView$2.smali'
          grep -q 'angulismo://focus-menu' 'decompiled/smali/com/angulismotv/fragments/AgendaFragment$setupWebView$2.smali'
          grep -q 'angulismotv.pages.dev' decompiled/smali/com/angulismotv/fragments/AgendaFragment.smali
          grep -q 'requestFocus()Z' decompiled/smali/com/angulismotv/fragments/AgendaFragment.smali

      - name: Patch ExoPlayer audio renderer
        shell: bash
        run: |
          set -euxo pipefail
          FILE="decompiled/smali/com/angulismotv/UnifiedPlayerActivity.smali"
          test -f "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("decompiled/smali/com/angulismotv/UnifiedPlayerActivity.smali")
          s=p.read_text()
          old='''    .line 1512
              :goto_3
              new-instance v2, Lcom/google/android/exoplayer2/ExoPlayer$Builder;

              move-object v3, v1

              check-cast v3, Landroid/content/Context;

              invoke-direct {v2, v3}, Lcom/google/android/exoplayer2/ExoPlayer$Builder;-><init>(Landroid/content/Context;)V
          '''
          new='''    .line 1512
              :goto_3
              # Android TV audio compatibility: allow decoder fallback and
              # prefer the bundled FFmpeg audio extension when MediaCodec
              # cannot decode a stream correctly.
              new-instance v15, Lcom/google/android/exoplayer2/DefaultRenderersFactory;

              move-object v3, v1

              check-cast v3, Landroid/content/Context;

              invoke-direct {v15, v3}, Lcom/google/android/exoplayer2/DefaultRenderersFactory;-><init>(Landroid/content/Context;)V

              invoke-virtual {v15, v10}, Lcom/google/android/exoplayer2/DefaultRenderersFactory;->setEnableDecoderFallback(Z)Lcom/google/android/exoplayer2/DefaultRenderersFactory;

              move-result-object v15

              const/4 v2, 0x2

              invoke-virtual {v15, v2}, Lcom/google/android/exoplayer2/DefaultRenderersFactory;->setExtensionRendererMode(I)Lcom/google/android/exoplayer2/DefaultRenderersFactory;

              move-result-object v15

              new-instance v2, Lcom/google/android/exoplayer2/ExoPlayer$Builder;

              invoke-direct {v2, v3, v15}, Lcom/google/android/exoplayer2/ExoPlayer$Builder;-><init>(Landroid/content/Context;Lcom/google/android/exoplayer2/RenderersFactory;)V
          '''
          if old not in s:
              a=s.index("    .line 1512")
              print(s[a:a+700])
              raise SystemExit("Exact ExoPlayer constructor block not found; refusing unsafe patch")
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -n -A40 -B4 'Android TV audio compatibility' "$FILE"
          grep -q 'setEnableDecoderFallback' "$FILE"
          grep -q 'setExtensionRendererMode' "$FILE"
          grep -q '<init>(Landroid/content/Context;Lcom/google/android/exoplayer2/RenderersFactory;)V' "$FILE"
          # Keep this local build ahead of the official beta so its updater does not try to replace it.
          sed -i -E "s/versionCode: '[0-9]+'/versionCode: '105'/" decompiled/apktool.yml
          sed -i -E "s/versionName: .*/versionName: 1.4-tvagenda-audiofix/" decompiled/apktool.yml
          grep -A4 -B2 versionInfo decompiled/apktool.yml || true

      - name: Download ExoPlayer FFmpeg 2.19.1 extension
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://repo1.maven.org/maven2/org/jellyfin/exoplayer/exoplayer-ffmpeg-extension/2.19.1%2B1/exoplayer-ffmpeg-extension-2.19.1%2B1.aar' -o ffmpeg.aar
          mkdir -p ffmpeg-aar
          unzip -q ffmpeg.aar -d ffmpeg-aar
          test -f ffmpeg-aar/classes.jar
          find ffmpeg-aar -maxdepth 4 -type f | sort
          test -d ffmpeg-aar/jni

      - name: Dex FFmpeg extension
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          D8="$BUILD_TOOLS/d8"
          test -x "$D8"
          rm -rf ffmpeg-dex
          mkdir -p ffmpeg-dex
          "$D8" --release --min-api 21 ffmpeg-aar/classes.jar --output ffmpeg-dex
          test -f ffmpeg-dex/classes.dex
          ls -lh ffmpeg-dex/classes.dex

      - name: Rebuild patched APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar b decompiled -o rebuilt.apk
          unzip -t rebuilt.apk >/dev/null

      - name: Merge FFmpeg classes and native libraries
        shell: bash
        run: |
          set -euxo pipefail
          cp rebuilt.apk merged.apk
          cp ffmpeg-dex/classes.dex classes5.dex
          zip -q -u merged.apk classes5.dex
          rm -rf lib
          cp -R ffmpeg-aar/jni lib
          find lib -type f -name '*.so' -print
          # Native libraries must remain uncompressed for modern Android packaging.
          zip -q -0 -r merged.apk lib
          unzip -t merged.apk >/dev/null
          unzip -l merged.apk | grep -E 'classes5.dex|lib/.+\\.so' | head -80

      - name: Align and sign APK
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 merged.apk aligned.apk
          keytool -genkeypair -noprompt \
            -keystore audiofix.keystore \
            -storepass AngulismoAudioFix \
            -keypass AngulismoAudioFix \
            -alias audiofix \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Angulismo TV Audio Fix,OU=Local Build,O=Local,L=Buenos Aires,ST=Buenos Aires,C=AR"
          "$BUILD_TOOLS/apksigner" sign \
            --ks audiofix.keystore \
            --ks-pass pass:AngulismoAudioFix \
            --key-pass pass:AngulismoAudioFix \
            --out AngulismoTV-BETA-TVAgenda-AudioFix.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs AngulismoTV-BETA-TVAgenda-AudioFix.apk
          unzip -t AngulismoTV-BETA-TVAgenda-AudioFix.apk >/dev/null
          sha256sum AngulismoTV-BETA-TVAgenda-AudioFix.apk | tee TVAgenda-AudioFix-SHA256.txt
          ls -lh AngulismoTV-BETA-TVAgenda-AudioFix.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: AngulismoTV-BETA-TVAgenda-AudioFix
          path: |
            AngulismoTV-BETA-TVAgenda-AudioFix.apk
            TVAgenda-AudioFix-SHA256.txt
          if-no-files-found: error
