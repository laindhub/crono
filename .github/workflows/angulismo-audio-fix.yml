name: Angulismo APK diagnostic

on:
  push:
    branches: [angulismo-audio-fix]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool jq unzip

      - name: Fetch current Angulismo APK
        shell: bash
        run: |
          set -euxo pipefail
          RESP="$(curl -fsSL 'https://update.angulismotv.workers.dev/version?versionCode=4')"
          echo "$RESP" | tee version.json
          APK_URL="$(python3 - <<'PY'
import json
d=json.load(open('version.json'))
for k in ('apkUrl','apk_url','downloadUrl','download_url','url'):
    v=d.get(k)
    if isinstance(v,str) and v.startswith('http'):
        print(v); break
else:
    raise SystemExit('No APK URL in version response')
PY
)"
          echo "APK_URL=$APK_URL"
          curl -fL "$APK_URL" -o app.apk
          ls -lh app.apk

      - name: Decompile
        run: |
          apktool d -f app.apk -o decompiled

      - name: Inspect UnifiedPlayerActivity
        shell: bash
        run: |
          set -euxo pipefail
          FILE="$(find decompiled -type f -path '*com/angulismotv/UnifiedPlayerActivity.smali' | head -1)"
          echo "SMALI=$FILE"
          cp "$FILE" UnifiedPlayerActivity.smali
          grep -n -E 'showExoPlayer|DefaultRenderersFactory|setEnableDecoderFallback|setExtensionRendererMode|ExoPlayer\$Builder|HlsMediaSource' "$FILE" || true
          python3 - <<'PY'
from pathlib import Path
p=Path('UnifiedPlayerActivity.smali')
lines=p.read_text(errors='replace').splitlines()
need=('showExoPlayer','DefaultRenderersFactory','setEnableDecoderFallback','setExtensionRendererMode','ExoPlayer$Builder','HlsMediaSource')
idx=[i for i,l in enumerate(lines) if any(x in l for x in need)]
for i in idx:
    a=max(0,i-25); b=min(len(lines),i+80)
    print(f'\n--- lines {a+1}-{b} ---')
    print('\n'.join(lines[a:b]))
PY

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: angulismo-diagnostic
          path: |
            version.json
            app.apk
            UnifiedPlayerActivity.smali
