name: Angulismo APK diagnostic

on:
  push:
    branches:
      - angulismo-audio-fix
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool jq unzip

      - name: Fetch current Angulismo APK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL 'https://update.angulismotv.workers.dev/version?versionCode=4' -o version.json
          cat version.json
          EPHEMERAL_URL="$(jq -r '.apkUrl // empty' version.json)"
          test -n "$EPHEMERAL_URL"
          FILE_KEY="$(printf '%s' "$EPHEMERAL_URL" | awk -F/ '{print $(NF-1)}')"
          API_URL="https://www.mediafire.com/api/1.5/file/get_links.php?quick_key=$FILE_KEY&link_type=direct_download&response_format=json"
          curl -fsSL -A 'Mozilla/5.0' "$API_URL" -o mediafire-links.json
          cat mediafire-links.json
          APK_URL="$(jq -r '.response.links[0].direct_download // empty' mediafire-links.json)"
          test -n "$APK_URL"
          echo "Resolved MediaFire download URL"
          curl -fL -A 'Mozilla/5.0' "$APK_URL" -o app.apk
          ls -lh app.apk
          file app.apk
          unzip -t app.apk >/dev/null
      - name: Decompile
        run: |
          apktool d -f app.apk -o decompiled

      - name: Inspect UnifiedPlayerActivity
        shell: bash
        run: |
          set -euxo pipefail
          FILE="$(find decompiled -type f -path '*com/angulismotv/UnifiedPlayerActivity.smali' | head -1)"
          test -n "$FILE"
          echo "SMALI=$FILE"
          cp "$FILE" UnifiedPlayerActivity.smali
          echo '=== relevant references ==='
          grep -n -E 'showExoPlayer|DefaultRenderersFactory|setEnableDecoderFallback|setExtensionRendererMode|ExoPlayer\$Builder|HlsMediaSource' "$FILE" || true
          echo '=== showExoPlayer method ==='
          awk '/^\.method.*showExoPlayer/{p=1} p{print} p && /^\.end method/{exit}' "$FILE"

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: angulismo-diagnostic
          path: |
            version.json
            app.apk
            UnifiedPlayerActivity.smali
