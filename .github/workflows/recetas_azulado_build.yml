name: Build Recetas Azulado APK
on:
  push:
    branches:
      - 'build/recetas-azulado-20261018'
    paths:
      - '.github/workflows/recetas_azulado_build.yml'
      - 'recetas_azulado_build_source.zip.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Expand Recetas Azulado project
        run: |
          mkdir -p recetas-azulado-build
          base64 -d recetas_azulado_build_source.zip.b64 > /tmp/azulado-source.zip
          unzip -q /tmp/azulado-source.zip -d recetas-azulado-build
          test -f recetas-azulado-build/app/src/main/java/com/azulado/recetas/MainActivity.java
      - name: Build signed debug APK
        working-directory: recetas-azulado-build
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK package
        run: |
          test -s recetas-azulado-build/app/build/outputs/apk/debug/app-debug.apk
          sha256sum recetas-azulado-build/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RecetasAzulado-1.0.0-APK
          path: recetas-azulado-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
